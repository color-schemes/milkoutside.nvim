<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      background-color: rgb(4, 6, 7);
      color: rgb(232, 232, 232);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      width: 200px;
      margin: 0;
      padding: 16px;
    }
    
    .header {
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 16px;
      color: rgb(99, 195, 221);
    }
    
    .toggle-btn {
      background-color: rgb(48, 48, 48);
      color: rgb(232, 232, 232);
      border: 1px solid rgb(99, 195, 221);
      border-radius: 4px;
      padding: 8px 12px;
      cursor: pointer;
      font-size: 12px;
      width: 100%;
      margin-bottom: 8px;
    }
    
    .toggle-btn:hover {
      background-color: rgb(99, 195, 221);
      color: rgb(4, 6, 7);
    }
    
    .toggle-btn.active {
      background-color: rgb(99, 195, 221);
      color: rgb(4, 6, 7);
    }
    
    .status {
      font-size: 11px;
      margin-top: 12px;
      opacity: 0.8;
    }
  </style>
</head>
<body>
  <div class="header">MilkOutside Theme</div>
  <button id="toggleBtn" class="toggle-btn">Enable Theme</button>
  <div id="status" class="status">Theme is currently disabled</div>
  
  <script src="popup.js"></script>
</body>
</html>
