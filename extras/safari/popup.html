<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      background-color: rgb(4, 6, 7);
      color: rgb(232, 232, 232);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      width: 200px;
      margin: 0;
      padding: 16px;
    }
    
    .header {
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 16px;
      color: rgb(99, 195, 221);
    }
    
    .info {
      font-size: 12px;
      line-height: 1.4;
      opacity: 0.9;
    }
    
    .toggle {
      background-color: rgb(48, 48, 48);
      color: rgb(232, 232, 232);
      border: 1px solid rgb(99, 195, 221);
      border-radius: 4px;
      padding: 8px 12px;
      cursor: pointer;
      font-size: 12px;
      width: 100%;
      margin-top: 12px;
    }
    
    .toggle:hover {
      background-color: rgb(99, 195, 221);
      color: rgb(4, 6, 7);
    }
  </style>
</head>
<body>
  <div class="header">MilkOutside</div>
  <div class="info">
    MilkOutside theme for Safari
  </div>
  <button class="toggle" onclick="window.close()">Close</button>
</body>
</html>
